name: Event calendar refresh

on:
  schedule:
    - cron: "15 6 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: event-calendar-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresh event calendar
        run: python scripts/update_events.py
      - name: Commit event calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/events.json
          if git diff --cached --quiet; then
            echo "No event changes."
            exit 0
          fi
          git commit -m "chore(events): refresh calendar $(date -u +%Y-%m-%d)"
          git push
